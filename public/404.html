<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Strona nie została znaleziona | Eminstall</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .container {
        max-width: 600px;
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 48px 32px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(12px);
      }
      .badge {
        display: inline-block;
        font-family: monospace;
        font-size: 13px;
        font-weight: 700;
        color: #fb923c;
        background: rgba(249, 115, 22, 0.15);
        border: 1px solid rgba(249, 115, 22, 0.3);
        padding: 6px 14px;
        border-radius: 9999px;
        margin-bottom: 20px;
        letter-spacing: 0.1em;
      }
      h1 {
        font-size: 64px;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 12px;
        background: linear-gradient(to right, #ffffff, #cbd5e1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      h2 {
        font-size: 22px;
        font-weight: 600;
        color: #e2e8f0;
        margin-bottom: 16px;
      }
      p {
        font-size: 15px;
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      .btn-primary {
        background: #ea580c;
        color: #ffffff;
        font-weight: 600;
        font-size: 14px;
        padding: 12px 24px;
        border-radius: 12px;
        text-decoration: none;
        transition: background-color 0.2s, transform 0.1s;
      }
      .btn-primary:hover { background: #c2410c; }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #f1f5f9;
        font-weight: 500;
        font-size: 14px;
        padding: 12px 20px;
        border-radius: 12px;
        text-decoration: none;
        transition: background-color 0.2s;
      }
      .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }
      .contact-hint {
        margin-top: 36px;
        padding-top: 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 13px;
        color: #64748b;
      }
      .contact-hint a {
        color: #fb923c;
        text-decoration: none;
        font-weight: 600;
      }
      .contact-hint a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="badge">KOD BŁĘDU: HTTP 404</div>
      <h1>404</h1>
      <h2>Strona nie została znaleziona</h2>
      <p>
        Adres, pod który próbujesz się dostać, nie istnieje, został przeniesiony lub wpisano błędny URL.
      </p>
      <div class="actions">
        <a href="/" class="btn-primary">Strona główna</a>
        <a href="/#zakres-prac" class="btn-secondary">Zakres prac i realizacje</a>
        <a href="/#kontakt" class="btn-secondary">Kontakt</a>
      </div>
      <div class="contact-hint">
        Potrzebujesz szybkiego kontaktu z inżynierem? Zadzwoń: <a href="tel:+48696381123">+48 696 381 123</a>
      </div>
    </div>
  </body>
</html>
